<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Moments - Admin Scrapbook</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { sblue: { 50: '#E3F2FD', 200: '#90CAF9', 500: '#2196F3', 900: '#0D47A1' }, rpurple: { 100: '#FFC0DE', 300: '#ED96D7', 500: '#C654C3', 700: '#8E1EA2' } } } } }</script>
    <style>#toast-container { position: fixed; top: 1rem; right: 1rem; z-index: 100; display: flex; flex-direction: column; gap: 0.5rem; }</style>
</head>
<body class="bg-gray-50 font-sans text-gray-800 flex h-screen overflow-hidden">
    <div id="toast-container"></div>
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-20 hidden lg:hidden"></div>

    <aside id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-white border-r border-sblue-100 z-30 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 flex flex-col">
        <div class="h-16 flex items-center justify-center border-b border-sblue-100"><h2 class="text-xl font-bold text-sblue-900">Scrapbook Admin</h2></div>
        <nav class="flex-1 px-4 py-6 space-y-1 overflow-y-auto">
            <a href="/admin/dashboard" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-sblue-50 hover:text-sblue-600 rounded-lg font-medium transition-colors"><i class="fas fa-home w-5 text-center"></i> Dashboard</a>
            <a href="/admin/create-personal-profile" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-sblue-50 hover:text-sblue-600 rounded-lg font-medium transition-colors"><i class="fas fa-user-circle w-5 text-center"></i> Personal Profile</a>
            <a href="/admin/create-stories" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-sblue-50 hover:text-sblue-600 rounded-lg font-medium transition-colors"><i class="fas fa-book-open w-5 text-center"></i> Stories</a>
            <a href="/admin/create-moments" class="flex items-center gap-3 px-3 py-2.5 bg-sblue-50 text-sblue-600 rounded-lg font-medium"><i class="fas fa-star w-5 text-center"></i> Moments</a>
            <a href="/admin/create-gallery" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-sblue-50 hover:text-sblue-600 rounded-lg font-medium transition-colors"><i class="fas fa-images w-5 text-center"></i> Gallery</a>
            <a href="/admin/gallery-video" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-sblue-50 hover:text-sblue-600 rounded-lg font-medium transition-colors"><i class="fas fa-video w-5 text-center"></i> Videos</a>
            <a href="/admin/create-letters" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-sblue-50 hover:text-sblue-600 rounded-lg font-medium transition-colors"><i class="fas fa-envelope-open-text w-5 text-center"></i> Letters</a>
            <a href="/admin/create-song" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-sblue-50 hover:text-sblue-600 rounded-lg font-medium transition-colors"><i class="fas fa-music w-5 text-center"></i> Songs</a>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col h-full lg:ml-64 w-full relative">
        <header class="h-16 bg-white border-b border-sblue-100 flex items-center justify-between px-4 sm:px-6 z-10">
            <div class="flex items-center gap-4">
                <button id="mobile-menu-btn" class="lg:hidden text-gray-600 text-xl"><i class="fas fa-bars"></i></button>
                <h1 class="text-xl font-bold text-sblue-900 hidden sm:block">Manage Moments</h1>
            </div>
            <button onclick="openFormModal()" class="bg-sblue-500 hover:bg-sblue-900 text-white px-4 py-2 rounded-lg font-medium text-sm"><i class="fas fa-plus mr-1"></i> Add Moment</button>
        </header>

        <div class="flex-1 overflow-auto p-4 sm:p-6">
            <div class="bg-white border border-gray-100 rounded-xl shadow-sm overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead><tr class="bg-gray-50 border-b border-gray-100 text-xs uppercase text-gray-500 tracking-wider">
                        <th class="p-4 w-20">Thumb</th><th class="p-4">Title</th><th class="p-4">Date</th><th class="p-4 text-right">Actions</th>
                    </tr></thead>
                    <tbody id="table-body" class="text-sm divide-y divide-gray-100"></tbody>
                </table>
                <div class="p-4 border-t border-gray-100 flex justify-between items-center bg-gray-50">
                    <span id="page-info" class="text-sm text-gray-500">Page 1</span>
                    <div class="flex gap-2">
                        <button onclick="changePage(-1)" class="px-3 py-1 bg-white border border-gray-200 rounded text-gray-600"><i class="fas fa-chevron-left"></i></button>
                        <button onclick="changePage(1)" class="px-3 py-1 bg-white border border-gray-200 rounded text-gray-600"><i class="fas fa-chevron-right"></i></button>
                    </div>
                </div>
            </div>
        </div>

        <div id="form-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex justify-end">
            <div class="bg-white w-full max-w-md h-full flex flex-col shadow-2xl">
                <div class="p-6 border-b border-gray-100 flex justify-between bg-gray-50">
                    <h3 id="modal-title" class="text-xl font-bold text-gray-800">Add Moment</h3>
                    <button onclick="closeFormModal()" class="text-gray-400 hover:text-red-500 text-2xl"><i class="fas fa-times"></i></button>
                </div>
                <div class="flex-1 overflow-y-auto p-6">
                    <form id="data-form" class="space-y-4">
                        <input type="hidden" id="edit-id">
                        <div><label class="block text-sm font-medium mb-1">Title *</label><input type="text" id="input-title" required class="w-full border rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-sblue-500"></div>
                        <div><label class="block text-sm font-medium mb-1">Date *</label><input type="date" id="input-date" required class="w-full border rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-sblue-500"></div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Image <span id="img-req" class="text-red-500">*</span></label>
                            <input type="file" id="input-file" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:bg-sblue-50 file:text-sblue-600 cursor-pointer">
                            <img id="image-preview" src="" class="hidden mt-2 max-h-40 rounded border">
                        </div>
                    </form>
                </div>
                <div class="p-4 border-t bg-gray-50 flex justify-end gap-3">
                    <button onclick="closeFormModal()" class="px-5 py-2 border rounded-lg">Cancel</button>
                    <button onclick="saveData()" id="btn-save" class="px-5 py-2 bg-sblue-500 text-white rounded-lg">Save</button>
                </div>
            </div>
        </div>

        <div id="confirm-modal" class="fixed inset-0 bg-black/60 z-[60] hidden items-center justify-center p-4">
            <div class="bg-white rounded-xl p-6 text-center w-80">
                <i class="fas fa-trash-alt text-4xl text-red-500 mb-4"></i><h3 class="text-xl font-bold mb-4">Delete?</h3>
                <div class="flex justify-center gap-3"><button onclick="closeConfirmModal()" class="px-4 py-2 border rounded-lg">Cancel</button><button id="btn-confirm-delete" class="px-4 py-2 bg-red-500 text-white rounded-lg">Delete</button></div>
            </div>
        </div>
    </main>

    <script>
        const toast = (msg, isErr=false) => {
            const t = document.createElement('div');
            t.className = `px-4 py-3 rounded-lg shadow text-white text-sm font-medium mb-2 ${isErr ? 'bg-red-600' : 'bg-green-600'}`;
            t.textContent = msg;
            document.getElementById('toast-container').appendChild(t);
            setTimeout(() => { t.remove(); }, 3000);
        };
        const fileToBase64 = (f) => new Promise(r => { const rd = new FileReader(); rd.readAsDataURL(f); rd.onload = () => r(rd.result); });

        document.getElementById('mobile-menu-btn').addEventListener('click', () => { document.getElementById('sidebar').classList.remove('-translate-x-full'); document.getElementById('sidebar-overlay').classList.remove('hidden'); });
        document.getElementById('sidebar-overlay').addEventListener('click', () => { document.getElementById('sidebar').classList.add('-translate-x-full'); document.getElementById('sidebar-overlay').classList.add('hidden'); });

        let imgBase64 = null;
        document.getElementById('input-file').addEventListener('change', async (e) => {
            if(e.target.files[0]) { imgBase64 = await fileToBase64(e.target.files[0]); document.getElementById('image-preview').src = imgBase64; document.getElementById('image-preview').classList.remove('hidden'); }
        });

        let currentPage = 1, limit = 10, deleteId = null;
        async function loadData() {
            try {
                const res = await fetch(`/api/admin/moments?page=${currentPage}&limit=${limit}`);
                const data = await res.json();
                if(data.success) {
                    document.getElementById('page-info').textContent = `Page ${currentPage}`;
                    document.getElementById('table-body').innerHTML = data.data.length ? data.data.map(i => `
                        <tr class="border-b hover:bg-gray-50"><td class="p-4"><img src="${i.image_url}" class="w-12 h-12 rounded object-cover"></td><td class="p-4 font-medium">${i.title}</td><td class="p-4">${new Date(i.event_date).toLocaleDateString('id-ID')}</td><td class="p-4 text-right"><button onclick="editData(${i.id})" class="text-sblue-600 bg-sblue-50 w-8 h-8 rounded"><i class="fas fa-edit"></i></button> <button onclick="confirmDelete(${i.id})" class="text-red-600 bg-red-50 w-8 h-8 rounded"><i class="fas fa-trash"></i></button></td></tr>
                    `).join('') : '<tr><td colspan="4" class="p-4 text-center">No moments.</td></tr>';
                }
            } catch(e) {}
        }
        function changePage(d) { if(d===-1 && currentPage>1) currentPage--; else if(d===1) currentPage++; loadData(); }
        
        function openFormModal() {
            document.getElementById('edit-id').value = ''; document.getElementById('data-form').reset();
            imgBase64 = null; document.getElementById('image-preview').classList.add('hidden');
            document.getElementById('img-req').classList.remove('hidden'); document.getElementById('modal-title').textContent = 'Add Moment';
            document.getElementById('form-modal').classList.remove('hidden');
        }
        function closeFormModal() { document.getElementById('form-modal').classList.add('hidden'); }
        
        async function editData(id) {
            const res = await fetch(`/api/admin/moments/${id}`); const data = await res.json();
            if(data.success) {
                document.getElementById('edit-id').value = data.data.id; document.getElementById('input-title').value = data.data.title;
                document.getElementById('input-date').value = data.data.event_date.split('T')[0];
                document.getElementById('image-preview').src = data.data.image_url; document.getElementById('image-preview').classList.remove('hidden');
                imgBase64 = null; document.getElementById('img-req').classList.add('hidden');
                document.getElementById('modal-title').textContent = 'Edit Moment'; document.getElementById('form-modal').classList.remove('hidden');
            }
        }

        async function saveData() {
            const id = document.getElementById('edit-id').value, title = document.getElementById('input-title').value, date = document.getElementById('input-date').value;
            if(!title || !date) return toast('Required fields missing', true);
            if(!id && !imgBase64) return toast('Image required', true);
            const payload = { title, event_date: date }; if(imgBase64) payload.imageBase64 = imgBase64;
            const btn = document.getElementById('btn-save'); btn.disabled = true; btn.textContent = 'Saving...';
            try {
                const res = await fetch(id ? `/api/admin/moments/${id}` : '/api/admin/moments', { method: id ? 'PUT' : 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
                if((await res.json()).success) { toast('Saved'); closeFormModal(); loadData(); }
            } catch(e) {} finally { btn.disabled = false; btn.textContent = 'Save'; }
        }

        function confirmDelete(id) { deleteId = id; document.getElementById('confirm-modal').classList.remove('hidden'); document.getElementById('confirm-modal').classList.add('flex'); }
        function closeConfirmModal() { document.getElementById('confirm-modal').classList.add('hidden'); document.getElementById('confirm-modal').classList.remove('flex'); }
        document.getElementById('btn-confirm-delete').addEventListener('click', async () => {
            await fetch(`/api/admin/moments/${deleteId}`, { method: 'DELETE' }); closeConfirmModal(); loadData(); toast('Deleted');
        });

        loadData();
    </script>
</body>
</html>
